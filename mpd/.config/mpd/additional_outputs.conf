# MPD Outputs
#
# SEE ALSO
# 1. https://mpd.readthedocs.io/en/latest/plugins.html#

# Audio Output ################################################################

# NOTE(jeff): This audio output seems to best handle switching system audio
# outputs on OS X, i.e.: Bluetooth headphones, without requiring a restart of
# mpd.
audio_output {
  type            "openal"
  name            "OpenAL Audio Output"
  enabled         "no"
}

audio_output {
  type            "alsa"
  name            "ALSA"
  device          "hw:1"
  mixer_type      "hardware"
  mixer_device    "hw:1"
  mixer_control   "PCM" # PCM || Master
  mixer_index     "0"
  enabled         "yes"
}

